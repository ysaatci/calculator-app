name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go build ./...

      # -race needs cgo, which isn't available on every dev machine but is
      # free here, so concurrency bugs get caught in CI rather than in prod.
      - name: Test
        run: |
          status=0
          go test ./... -race -covermode=atomic -coverprofile=coverage.out -json > go-test.json || status=$?
          # -json replaces the usual output: show package results, or
          # everything if something failed.
          if [ "$status" -ne 0 ]; then
            jq -r 'select(.Action == "output" or .Action == "build-output") | .Output' go-test.json
          else
            jq -r 'select(.Action == "output" and .Test == null) | .Output' go-test.json
          fi
          exit "$status"

      - name: Coverage report
        run: |
          set -euo pipefail
          # cmd/server only starts the process and handles signals; it runs in
          # the end-to-end job rather than in unit tests, so the figure
          # covers internal/... only.
          grep -v '/cmd/' coverage.out > coverage.internal.out
          coverage=$(go tool cover -func=coverage.internal.out | awk '/^total:/ { sub("%", "", $NF); print $NF }')
          passed=$(jq -s '[.[] | select(.Action == "pass" and .Test != null)] | length' go-test.json)

          mkdir -p report
          go tool cover -html=coverage.internal.out -o report/index.html
          jq -n --argjson coverage "$coverage" --argjson passed "$passed" \
            '{coverage: $coverage, passed: $passed}' > report/report.json

          {
            echo "### Backend"
            echo ""
            echo "| Tests passed (incl. subtests) | Coverage, internal/... |"
            echo "|---|---|"
            echo "| $passed | $coverage% |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: backend-report
          path: backend/report/
          retention-days: 7

  frontend:
    name: Frontend (React + TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --noEmit

      - name: Test
        run: npm run coverage -- --reporter=default --reporter=json --outputFile.json=vitest-results.json

      - name: Coverage report
        run: |
          set -euo pipefail
          summary=coverage/coverage-summary.json
          passed=$(jq '.numPassedTests' vitest-results.json)
          statements=$(jq '.total.statements.pct' "$summary")
          branches=$(jq '.total.branches.pct' "$summary")
          functions=$(jq '.total.functions.pct' "$summary")
          lines=$(jq '.total.lines.pct' "$summary")

          mkdir -p report
          cp -r coverage/. report/
          jq -n --argjson coverage "$statements" --argjson passed "$passed" \
            '{coverage: $coverage, passed: $passed}' > report/report.json

          {
            echo "### Frontend"
            echo ""
            echo "| Tests passed | Statements | Branches | Functions | Lines |"
            echo "|---|---|---|---|---|"
            echo "| $passed | $statements% | $branches% | $functions% | $lines% |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-report
          path: frontend/report/
          retention-days: 7

  # Unit tests on either side mock the other, so nothing above would notice
  # if the two stopped agreeing on the wire format, or if the keypad stopped
  # being wired up. This runs the real containers, calls them over HTTP, and
  # drives the UI in a browser.
  integration:
    name: End-to-end (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build --wait

      - name: Frontend is served
        run: |
          curl --fail --silent --show-error http://localhost:3000 > /dev/null

      - name: Backend answers the shape the frontend expects
        run: |
          set -euo pipefail

          result=$(curl --fail --silent -X POST http://localhost:8080/api/v1/calculate \
            -H 'Content-Type: application/json' \
            -d '{"operation":"add","a":2,"b":3}' | jq -r '.result')
          [ "$result" = "5" ] || { echo "add returned $result, want 5"; exit 1; }

          # Unary operations must omit "b" rather than echoing a zero.
          body=$(curl --fail --silent -X POST http://localhost:8080/api/v1/calculate \
            -H 'Content-Type: application/json' \
            -d '{"operation":"sqrt","a":9}')
          echo "$body" | jq -e '.result == 3 and (has("b") | not)' > /dev/null \
            || { echo "unexpected sqrt body: $body"; exit 1; }

      - name: Errors carry a message the UI can display
        run: |
          set -euo pipefail

          status=$(curl --silent --output /tmp/err.json --write-out '%{http_code}' \
            -X POST http://localhost:8080/api/v1/calculate \
            -H 'Content-Type: application/json' \
            -d '{"operation":"divide","a":1,"b":0}')
          [ "$status" = "400" ] || { echo "got status $status, want 400"; exit 1; }
          jq -e '.error == "division by zero"' /tmp/err.json > /dev/null \
            || { echo "unexpected error body: $(cat /tmp/err.json)"; exit 1; }

      - name: Observability surfaces are live
        run: |
          set -euo pipefail

          curl --fail --silent http://localhost:8080/metrics \
            | grep -q 'calculator_calculations_total' \
            || { echo "calculation metrics missing from /metrics"; exit 1; }

          # Every response must carry an ID that can be traced back to a log line.
          request_id=$(curl --fail --silent --output /dev/null --dump-header - \
            -X POST http://localhost:8080/api/v1/calculate \
            -H 'Content-Type: application/json' \
            -d '{"operation":"add","a":1,"b":1}' \
            | grep -i '^x-request-id:' | tr -d '\r' | awk '{print $2}')
          [ -n "$request_id" ] || { echo "no X-Request-Id header"; exit 1; }

          # The access log is written after the response is sent, so give it
          # a moment rather than racing it.
          sleep 1
          docker compose logs backend | grep -q "$request_id" \
            || { echo "request id $request_id absent from backend logs"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install browser test tooling
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Drive the real UI
        working-directory: frontend
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
          PLAYWRIGHT_HTML_OPEN: never
        run: npm run test:e2e -- --reporter=github,json,html

      - uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: frontend/playwright-results.json
          retention-days: 7

      - name: End-to-end summary
        if: always()
        working-directory: frontend
        run: |
          [ -f playwright-results.json ] || exit 0
          passed=$(jq '.stats.expected' playwright-results.json)
          failed=$(jq '.stats.unexpected' playwright-results.json)
          flaky=$(jq '.stats.flaky' playwright-results.json)
          {
            echo "### End-to-end"
            echo ""
            echo "API contract checks passed against the Compose stack."
            echo ""
            echo "| Browser tests passed | Failed | Flaky |"
            echo "|---|---|---|"
            echo "| $passed | $failed | $flaky |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Show backend logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down

  # Publishes the coverage reports and badge data to GitHub Pages, so they can
  # be read without signing in or downloading artifacts.
  publish-reports:
    name: Publish coverage reports
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, integration]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-report
          path: site/backend

      - uses: actions/download-artifact@v4
        with:
          name: frontend-report
          path: site/frontend

      # Job summaries on the run page aren't shown to signed-out visitors, so
      # the end-to-end results go on the public page too.
      - uses: actions/download-artifact@v4
        with:
          name: e2e-results
          path: e2e

      - name: Build badges and index page
        env:
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          # Shields.io endpoint format: https://shields.io/badges/endpoint-badge
          badge() {
            local pct=$1 label=$2 color
            color=$(awk -v p="$pct" 'BEGIN {
              if (p >= 90) print "brightgreen"; else if (p >= 80) print "green";
              else if (p >= 70) print "yellowgreen"; else if (p >= 60) print "yellow";
              else print "red" }')
            jq -n --arg label "$label" --arg message "$(printf '%.1f%%' "$pct")" --arg color "$color" \
              '{schemaVersion: 1, label: $label, message: $message, color: $color}'
          }

          backend=$(jq '.coverage' site/backend/report.json)
          backend_tests=$(jq '.passed' site/backend/report.json)
          frontend=$(jq '.coverage' site/frontend/report.json)
          frontend_tests=$(jq '.passed' site/frontend/report.json)
          e2e_tests=$(jq '.stats.expected' e2e/playwright-results.json)

          mkdir -p site/badges
          badge "$backend" "backend coverage" > site/badges/backend.json
          badge "$frontend" "frontend coverage" > site/badges/frontend.json

          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Calculator App coverage</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 3rem auto; padding: 0 1rem; color: #24292f; }
              table { border-collapse: collapse; width: 100%; margin: 1.5rem 0; }
              th, td { text-align: left; padding: .6rem .8rem; border-bottom: 1px solid #d0d7de; }
              a { color: #0969da; }
              .muted { color: #57606a; font-size: .9rem; }
            </style>
          </head>
          <body>
            <h1>Calculator App coverage</h1>
            <table>
              <tr><th>Part</th><th>Tests passed</th><th>Coverage</th><th>Report</th></tr>
              <tr><td>Backend (Go, internal/...)</td><td>${backend_tests}</td><td>$(printf '%.1f' "$backend")%</td><td><a href="backend/">Open</a></td></tr>
              <tr><td>Frontend (React + TS, statements)</td><td>${frontend_tests}</td><td>$(printf '%.1f' "$frontend")%</td><td><a href="frontend/">Open</a></td></tr>
              <tr><td>End-to-end (Playwright, desktop and mobile)</td><td>${e2e_tests}</td><td>–</td><td><a href="${RUN_URL}">CI run</a></td></tr>
            </table>
            <p class="muted">The end-to-end job also checks the API contract against the running Docker Compose stack.</p>
            <p class="muted">Backend coverage excludes cmd/server, which only starts the process and is exercised by the end-to-end tests.</p>
            <p class="muted">Built from commit <code>${COMMIT:0:7}</code> · <a href="${RUN_URL}">CI run</a> · <a href="${REPO_URL}">Repository</a></p>
          </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
